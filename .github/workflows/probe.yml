name: probe-gated
on:
  push:
    paths: ['gate-trigger.txt']
jobs:
  gate:
    runs-on: ubuntu-latest
    environment: probe
    concurrency:
      group: probe-gate
      cancel-in-progress: true
    steps:
      - run: echo "gate passed for ${{ github.run_id }}"
  deploy:
    needs: gate
    runs-on: ubuntu-latest
    concurrency:
      group: probe-deploy
      cancel-in-progress: false
    steps:
      - run: echo "deploying ${{ github.run_id }}"; sleep 240; echo done
